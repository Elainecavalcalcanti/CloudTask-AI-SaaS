<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudTask AI SaaS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>☁️ CloudTask AI SaaS</h1>


    <div id="login">

        <h2>Login Administrativo</h2>

        <div class="input-group">
            <label>Usuário</label>
            <input
                type="text"
                id="username"
                placeholder="Digite o usuário"
                value="admin">
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input
                type="password"
                id="password"
                placeholder="Digite a senha"
                value="admin#123">
        </div>

        <button class="btn-login" onclick="login()">
            Entrar
        </button>

    </div>

    <div id="app" style="display:none;">

        <h2>Painel Administrativo</h2>

        <button onclick="listarTarefas()">
            Atualizar Lista
        </button>

        <button onclick="logout()">
            Sair
        </button>

        <hr>

        <h3>Nova Tarefa</h3>

        <input
            id="titulo"
            placeholder="Título">

        <input
            id="descricao"
            placeholder="Descrição">

        <select id="prioridade">

            <option value="low">low</option>

            <option value="medium" selected>medium</option>

            <option value="high">high</option>

        </select>

        <button onclick="criarTarefa()">
            Salvar Tarefa
        </button>

        <hr>

        <h3>Tarefas</h3>

        <ul id="lista"></ul>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
